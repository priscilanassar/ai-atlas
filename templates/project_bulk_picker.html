<dialog id="project-bulk-picker" aria-labelledby="picker-title"><form method="dialog" class="picker-close"><button aria-label="Close project selection">CLOSE ×</button></form><p class="eyebrow">ADMIN / PROJECT MANAGEMENT</p><h2 id="picker-title">Select projects to delete</h2><label for="project-picker-search">SEARCH PROJECTS</label><input id="project-picker-search" type="search" placeholder="Search by name or artist" data-selection-search><form method="post" action="{% url 'projects_bulk_delete' %}" data-project-picker-form>{% csrf_token %}<div class="picker-actions"><strong data-selected-count>0 selected</strong><button type="button" data-select-shown>Select all shown</button><button type="button" data-clear-selection>Clear</button><button type="submit" data-review-selection disabled>Review deletion</button></div><div class="project-picker-list">{% for item in manageable_projects %}<label class="project-picker-item"><input type="checkbox" name="project_ids" value="{{ item.pk }}" aria-label="Select {{ item.title }}">{% if item.thumbnail_url %}<img src="{{ item.thumbnail_url }}" alt="" loading="lazy" decoding="async">{% endif %}<span><strong>{{ item.title }}</strong><small>{{ item.artist }}</small></span></label>{% endfor %}</div></form></dialog>
