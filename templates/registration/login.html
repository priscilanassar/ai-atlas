
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — AI ATLAS</title>
    <link rel="stylesheet" href="{% static 'css/collection.css' %}">
</head>
<body>
{% include 'navbar.html' %}

<main class="form-page">
    <div class="form-card">
        <span>WELCOME BACK</span>
        <h1>LOGIN</h1>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">ENTER THE ATLAS ↗</button>
        </form>

        <p>New here?
            <a href="{% url 'signup' %}">Create account</a>
        </p>
    </div>
</main>
</body>
</html>
